name: Feature Request
description: Suggest an improvement or new Bactory module
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think it should work.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Smart Contracts
        - Market Factory
        - Liquidity
        - Yield
        - Treasury
        - Agents
        - Bounties
        - Community
        - SDK
        - Other

  - type: textarea
    id: notes
    attributes:
      label: Additional context
